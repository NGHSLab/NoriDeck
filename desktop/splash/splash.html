<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    />
    <title>NoriDeck</title>
    <!--
      스플래시 창 (desktop/src/splash.ts 가 연다).
      렌더러(runtime) 빌드와 무관한 정적 HTML 이라 Electron 이 뜨는 즉시 보인다.
      {{version}} 은 main 프로세스가 app.getVersion() 으로 치환한다. 로고는 assets/logo/NoriDeck_console.svg 사본.
    -->
    <style>
      :root {
        color-scheme: dark;
        --cream: #f1ede9;
        --muted: #8a827b;
        --mint: #3df0d2;
        --blue: #2f7bff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family:
          'Segoe UI Variable Display',
          'Segoe UI',
          Pretendard,
          -apple-system,
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .card {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        background: linear-gradient(160deg, #1b303a 0%, #0c171e 55%, #060b10 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 44px;
        box-sizing: border-box;
        animation: fade-in 0.35s ease-out both;
      }
      .glow {
        position: absolute;
        width: 380px;
        height: 380px;
        left: -90px;
        top: -140px;
        background: radial-gradient(
          closest-side,
          rgba(61, 240, 210, 0.3),
          rgba(47, 123, 255, 0.08) 55%,
          transparent 75%
        );
        filter: blur(12px);
        pointer-events: none;
      }
      .logo {
        position: relative;
        width: 176px;
        flex: none;
        filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.45));
      }
      .logo svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .text {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .name {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        color: var(--cream);
      }
      .name em {
        font-style: normal;
        color: var(--mint);
      }
      .version {
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
      }
      .bar::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--mint), transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="logo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="56 136 400 258"
          width="400"
          height="258"
          role="img"
          aria-label="NoriDeck console"
        >
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#15262f" />
              <stop offset="1" stop-color="#060b10" />
            </linearGradient>
            <radialGradient id="bgGlow" cx="0.5" cy="0.58" r="0.6">
              <stop offset="0" stop-color="#3df0d2" stop-opacity="0.42" />
              <stop offset="0.5" stop-color="#2f7bff" stop-opacity="0.10" />
              <stop offset="1" stop-color="#2f7bff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>

            <!-- console body: lit from top-left -->
            <linearGradient id="bodyTop" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.55" stop-color="#f1ede9" />
              <stop offset="1" stop-color="#d5cec7" />
            </linearGradient>
            <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#bfb7b0" />
              <stop offset="1" stop-color="#8a827b" />
            </linearGradient>
            <linearGradient id="bodyRim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1" />
              <stop offset="1" stop-color="#000000" stop-opacity="0.12" />
            </linearGradient>

            <!-- screen -->
            <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#060c10" />
              <stop offset="1" stop-color="#101a20" />
            </linearGradient>
            <radialGradient id="screenGlow" cx="0.5" cy="0.6" r="0.65">
              <stop offset="0" stop-color="#3df0d2" stop-opacity="0.55" />
              <stop offset="0.6" stop-color="#2f7bff" stop-opacity="0.14" />
              <stop offset="1" stop-color="#2f7bff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.06" />
              <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>

            <!-- flame -->
            <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e2fff8" />
              <stop offset="0.45" stop-color="#3df0d2" />
              <stop offset="1" stop-color="#2f7bff" />
            </linearGradient>
            <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="1" stop-color="#b3fff2" />
            </linearGradient>

            <!-- controls -->
            <linearGradient id="dpad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4b403b" />
              <stop offset="1" stop-color="#2a2320" />
            </linearGradient>
            <radialGradient id="btnA" cx="0.35" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#d9fff7" />
              <stop offset="0.45" stop-color="#3df0d2" />
              <stop offset="1" stop-color="#17b09a" />
            </radialGradient>
            <radialGradient id="btnB" cx="0.35" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#6b5e57" />
              <stop offset="1" stop-color="#241e1b" />
            </radialGradient>

            <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
              <feDropShadow
                dx="14"
                dy="30"
                stdDeviation="18"
                flood-color="#020a10"
                flood-opacity="0.75"
              />
            </filter>
            <filter id="contact" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="10" />
            </filter>
            <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
            <filter id="flameGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="9" />
            </filter>
            <filter id="inset" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
            <filter id="tinyBlur">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>

            <clipPath id="screenClip">
              <rect x="176" y="182" width="160" height="148" rx="14" />
            </clipPath>
            <clipPath id="bodyClip">
              <rect x="66" y="146" width="380" height="220" rx="52" />
            </clipPath>
          </defs>

          <!-- tilted console -->
          <g>
            <!-- slab thickness (drawn below the top face) -->
            <rect x="66" y="164" width="380" height="220" rx="52" fill="url(#bodySide)" />
            <rect
              x="66"
              y="164"
              width="380"
              height="220"
              rx="52"
              fill="none"
              stroke="#101418"
              stroke-width="3"
            />

            <!-- top face -->
            <rect x="66" y="146" width="380" height="220" rx="52" fill="url(#bodyTop)" />
            <rect
              x="66"
              y="146"
              width="380"
              height="220"
              rx="52"
              fill="none"
              stroke="#101418"
              stroke-width="3"
            />
            <rect
              x="67.5"
              y="147.5"
              width="377"
              height="217"
              rx="50.5"
              fill="none"
              stroke="url(#bodyRim)"
              stroke-width="3"
            />

            <!-- subtle plastic sheen across the face -->
            <g clip-path="url(#bodyClip)" opacity="0.55">
              <path d="M40,120 L300,120 L140,380 L-40,380 Z" fill="#ffffff" fill-opacity="0.22" />
            </g>

            <!-- screen bezel with inner shadow -->
            <rect x="164" y="170" width="184" height="172" rx="20" fill="url(#bezel)" />
            <rect
              x="164"
              y="170"
              width="184"
              height="172"
              rx="20"
              fill="none"
              stroke="#000000"
              stroke-opacity="0.35"
              stroke-width="6"
              filter="url(#inset)"
            />
            <rect
              x="164"
              y="170"
              width="184"
              height="172"
              rx="20"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.08"
              stroke-width="1.5"
            />

            <!-- screen -->
            <g clip-path="url(#screenClip)">
              <rect x="176" y="182" width="160" height="148" fill="#081419" />
              <rect x="176" y="182" width="160" height="148" fill="url(#screenGlow)" />

              <!-- flame glow bloom -->
              <g filter="url(#flameGlow)" opacity="0.85">
                <path
                  transform="translate(211,196) scale(0.75)"
                  d="M60,0 C72,28 104,48 104,96 C104,134 84,160 60,160 C36,160 16,134 16,96 C16,74 30,62 36,44 C40,60 52,64 54,50 C56,32 50,16 60,0 Z"
                  fill="#3df0d2"
                />
              </g>
              <!-- flame -->
              <path
                transform="translate(211,196) scale(0.75)"
                d="M60,0 C72,28 104,48 104,96 C104,134 84,160 60,160 C36,160 16,134 16,96 C16,74 30,62 36,44 C40,60 52,64 54,50 C56,32 50,16 60,0 Z"
                fill="url(#flame)"
              />
              <path
                transform="translate(211,196) scale(0.75)"
                d="M60,70 C70,90 84,100 84,122 C84,142 72,156 60,156 C48,156 36,142 36,122 C36,108 44,100 48,90 C50,98 56,100 57,92 C58,84 56,78 60,70 Z"
                fill="url(#core)"
              />

              <!-- faint scanlines -->
              <g stroke="#000000" stroke-opacity="0.10" stroke-width="1">
                <line x1="176" y1="190" x2="336" y2="190" />
                <line x1="176" y1="198" x2="336" y2="198" />
                <line x1="176" y1="206" x2="336" y2="206" />
                <line x1="176" y1="214" x2="336" y2="214" />
                <line x1="176" y1="222" x2="336" y2="222" />
                <line x1="176" y1="230" x2="336" y2="230" />
                <line x1="176" y1="238" x2="336" y2="238" />
                <line x1="176" y1="246" x2="336" y2="246" />
                <line x1="176" y1="254" x2="336" y2="254" />
                <line x1="176" y1="262" x2="336" y2="262" />
                <line x1="176" y1="270" x2="336" y2="270" />
                <line x1="176" y1="278" x2="336" y2="278" />
                <line x1="176" y1="286" x2="336" y2="286" />
                <line x1="176" y1="294" x2="336" y2="294" />
                <line x1="176" y1="302" x2="336" y2="302" />
                <line x1="176" y1="310" x2="336" y2="310" />
                <line x1="176" y1="318" x2="336" y2="318" />
                <line x1="176" y1="326" x2="336" y2="326" />
              </g>
              <!-- glass reflection -->
              <rect x="176" y="182" width="160" height="148" fill="url(#glass)" />
            </g>

            <!-- d-pad with bevel -->
            <g>
              <g fill="#000000" fill-opacity="0.22" filter="url(#tinyBlur)">
                <rect x="97" y="241" width="60" height="20" rx="5" />
                <rect x="117" y="221" width="20" height="60" rx="5" />
              </g>
              <g fill="url(#dpad)">
                <rect x="96" y="238" width="60" height="20" rx="5" />
                <rect x="116" y="218" width="20" height="60" rx="5" />
              </g>
              <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5">
                <path d="M100,239 h52" />
                <path d="M120,219 h12" />
              </g>
            </g>

            <!-- buttons -->
            <g>
              <circle
                cx="379"
                cy="243"
                r="13"
                fill="#000000"
                fill-opacity="0.25"
                filter="url(#tinyBlur)"
              />
              <circle cx="378" cy="240" r="13" fill="url(#btnA)" />
              <circle cx="373" cy="235" r="4" fill="#ffffff" fill-opacity="0.55" />
              <circle
                cx="411"
                cy="269"
                r="13"
                fill="#000000"
                fill-opacity="0.25"
                filter="url(#tinyBlur)"
              />
              <circle
                cx="410"
                cy="266"
                r="13"
                fill="url(#btnB)"
                stroke="#3df0d2"
                stroke-opacity="0.7"
                stroke-width="2.5"
              />
              <circle cx="405" cy="261" r="3.5" fill="#ffffff" fill-opacity="0.35" />
            </g>

            <!-- speaker grille -->
            <g fill="#000000" fill-opacity="0.22">
              <circle cx="384" cy="316" r="4" />
              <circle cx="400" cy="316" r="4" />
              <circle cx="416" cy="316" r="4" />
              <circle cx="392" cy="330" r="4" />
              <circle cx="408" cy="330" r="4" />
            </g>
            <g fill="#ffffff" fill-opacity="0.5">
              <circle cx="383" cy="314.5" r="1.2" />
              <circle cx="399" cy="314.5" r="1.2" />
              <circle cx="415" cy="314.5" r="1.2" />
              <circle cx="391" cy="328.5" r="1.2" />
              <circle cx="407" cy="328.5" r="1.2" />
            </g>
          </g>
        </svg>
      </div>
      <div class="text">
        <div class="name">Nori<em>Deck</em></div>
        <div class="version">v{{version}}</div>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
