name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # CI 는 타입체크·테스트·웹 빌드만 하므로 Electron 바이너리(약 100MB) 다운로드를 건너뛴다
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
